name: CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          test -f index.html
          grep -q "<html" index.html
          echo "Проверка структуры HTML пройдена."

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/test.sh
      - run: sh tests/test_html.sh

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p public
          cp index.html public/
          echo "Pipeline: $GITHUB_RUN_ID" > public/build-info.txt
          echo "Branch: $GITHUB_REF_NAME" >> public/build-info.txt
          echo "Commit: $(echo $GITHUB_SHA | cut -c1-7)" >> public/build-info.txt
          echo "Сборка завершена."
      - uses: actions/upload-artifact@v4
        with:
          name: public
          path: public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy-pages:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
